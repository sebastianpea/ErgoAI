server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo de carga para fotos de alta resolución (hasta 50 MB)
    client_max_body_size 50M;

    # Archivos estáticos del bundle compilado (JS, CSS, fuentes, imágenes locales)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas multimedia almacenadas por el backend (fotos subidas)
    location ^~ /media/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas exclusivas de API del backend
    location ~ ^/(vision|rag|catalogo|salud|metricas)(/.*)?$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Exportaciones de archivo (Excel .xlsx y PDF .pdf)
    location ~ ^/casos/[^/]+/exportar/(excel|pdf)$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Rutas exclusivas de vistas del frontend SPA (nuevo caso, vista de plan, vista de informe)
    # Estas rutas nunca existen en FastAPI y siempre deben servir la app React (index.html)
    location ~ ^/casos/(nuevo|[^/]+/(plan|informe))$ {
        try_files $uri /index.html;
    }

    # Rutas compartidas entre frontend SPA y backend API (/casos, /alertas, /bitacora)
    # Si el cliente solicita HTML (navegador recargando F5 o entrando por URL), servir index.html
    location ~ ^/(casos|alertas|bitacora)(/.*)?$ {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SPA routing para la raíz y cualquier otra ruta
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
