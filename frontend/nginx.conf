server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: cualquier ruta del frontend (ej. /casos/C-009/plan) devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tamaño máximo de carga para fotos de alta resolución (hasta 50 MB)
    client_max_body_size 50M;

    # Proxy reverso hacia el backend dentro de la red Docker con timeouts extendidos para IA
    location ~ ^/(casos|alertas|bitacora|rag|media|vision|catalogo|salud)(/.*)?$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts de 300s (5 minutos) para evitar errores 504 Gateway Time-out durante inferencia IA en CPU
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
