[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ergoai"
version = "0.1.0"
description = "Agente Inteligente de Ergonomía y Copiloto Analítico para Manufactura Jabil"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rtmlib>=0.1.0",
    "onnxruntime>=1.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

